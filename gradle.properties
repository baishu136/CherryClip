org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 项目位于含中文的路径（F:\AGENT\Gemini\剪切板），关闭 AGP 的非 ASCII 路径拦截。
# 注意：此处不要给 Gradle 守护进程加 -Dfile.encoding=UTF-8。
# 守护进程会把测试 worker 的 classpath 写成 @argfile，Windows 上 JVM 启动器按系统本地编码
# （中文系统为 GBK）读取该文件；若守护进程用 UTF-8 写入，含中文的路径会被读成乱码，
# 导致 JUnit 用例报 ClassNotFoundException。源码编码由 Kotlin/javac 各自的 UTF-8 选项保证。
android.overridePathCheck=true
